<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | ExamMock AI</title><link rel="stylesheet" href="css/app.css"></head><body><div id="appNav"></div><main class="authwrap"><div class="authcard"><span class="eyebrow">SECURE ACCESS</span><h1>Welcome to ExamMock AI</h1><p class="muted">Login with your User ID or email and password.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Create Account</button></div><div id="loginForm" class="stack"><div class="field"><label>User ID or Email</label><input id="loginIdentifier" placeholder="Enter User ID or email" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Login</button></div><div id="registerForm" class="stack hidden"><div class="field"><label>Name</label><input id="regName" placeholder="Your name" autocomplete="name"></div><div class="field"><label>User ID</label><input id="regUserId" placeholder="Choose a User ID" autocomplete="username"></div><div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="Your email address" autocomplete="email"></div><div class="field"><label>Password</label><input id="regPassword" type="password" placeholder="Minimum 8 characters" autocomplete="new-password"></div><button class="btn primary" id="registerBtn">Create Account</button></div><div id="authMsg" class="msg"></div></div></main><script src="js/common.js"></script><script src="js/login.js"></script></body></html>
