<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solutions | ExamMock AI</title><link rel="stylesheet" href="css/app.css">
<style>
.solutionLayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.solutionTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.badge.correct{background:#dcfce7;color:#166534}.badge.wrong{background:#fee2e2;color:#991b1b}.badge.unattempted{background:#f1f5f9;color:#475569}.solQuestion{font-size:18px;line-height:1.7;margin:22px 0;white-space:pre-wrap}.solOption{display:flex;gap:10px;border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin:9px 0}.solOption.correct{background:#f0fdf4;border-color:#22c55e}.solOption.selectedWrong{background:#fef2f2;border-color:#ef4444}.solOption.selectedCorrect{background:#dcfce7;border-color:#16a34a}.answerLabels{font-size:12px;margin-left:auto;font-weight:800}.solutionBox{margin-top:20px;background:#f8fafc;border-radius:14px;padding:18px}.solutionBox p{white-space:pre-wrap;line-height:1.7}.trick{margin-top:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px}.solPalette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.solPalette button{height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-weight:800;cursor:pointer}.solPalette button.correct{background:#16a34a;color:#fff}.solPalette button.wrong{background:#dc2626;color:#fff}.solPalette button.unattempted{background:#e2e8f0}.solPalette button.current{outline:3px solid #2563eb;outline-offset:2px}@media(max-width:850px){.solutionLayout{grid-template-columns:1fr}}
</style></head><body><div id="appNav"></div><main class="container">
<div class="pagehead"><span class="eyebrow">DETAILED SOLUTIONS</span><h1 id="title">Solutions</h1><p id="meta" class="muted"></p></div>
<div class="solutionLayout"><section><div id="solutionCard" class="panel"></div><div class="actions"><button id="prevSolution" class="btn" onclick="move(-1)">Previous</button><button id="nextSolution" class="btn primary" onclick="move(1)">Next</button><a class="btn" href="result.htm">Back to Result</a></div></section>
<aside class="panel"><h3>Questions</h3><p class="muted">Green: correct • Red: wrong • Grey: unattempted</p><div id="solPalette" class="solPalette"></div></aside></div>
</main><script src="js/common.js"></script><script src="js/solutions.js"></script></body></html>
